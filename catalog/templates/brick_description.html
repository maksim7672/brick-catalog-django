<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ brick.name }} — Описание</title>
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .description-card {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .back-link {
            text-decoration: none;
            color: #2980b9;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .brick-title {
            color: #2c3e50;
            margin-top: 0;
            font-size: 28px;
        }
        .brick-main-img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .info-row {
            font-size: 16px;
            margin-bottom: 10px;
            color: #34495e;
        }
        .info-label {
            font-weight: bold;
        }
        .description-text {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.6;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
            margin-top: 20px;
        }
    </style>
</head>


<body>

    <div class="description-card" style="max-width: 750px !important; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; border: 2px solid #ffffff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);">

        <!-- Кнопка возврата -->
        <a href="/" class="back-link" style="text-decoration: none; color: #2980b9; font-weight: bold; display: inline-block; margin-bottom: 25px; font-size: 15px;">← Вернуться в каталог</a>

        <!-- Главный контейнер из двух колонок -->
        <div style="display: flex !important; gap: 40px !important; align-items: flex-start;">

            <!-- Левая колонка: ФОТО -->
            <div style="flex: 1; max-width: 320px;">
                {% if brick.image %}
                    <img src="{{ brick.image.url }}" alt="{{ brick.name }}" class="brick-main-img" style="width: 100%; max-height: 320px !important; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                {% endif %}
            </div>

            <!-- Правая колонка: ИНФО -->
            <div style="flex: 1.3;">
                <h1 style="margin-top: 0; margin-bottom: 15px; color: #2c3e50; font-size: 28px; font-weight: 700;">{{ brick.name }}</h1>

                <div style="font-size: 16px; margin-bottom: 10px; color: #34495e;"><span style="font-weight: bold; color: #7f8c8d;">Размер:</span> {{ brick.size }}</div>
                <div style="font-size: 16px; margin-bottom: 20px; color: #34495e;"><span style="font-weight: bold; color: #7f8c8d;">Цена:</span> <span style="color: #2980b9; font-weight: bold; font-size: 18px;">{{ brick.price }} руб./шт.</span></div>

                <div style="margin-top: 20px; border-top: 1px solid #edf2f7; padding-top: 20px;">
                    <h3 style="margin-top: 0; margin-bottom: 12px; color: #2c3e50; font-size: 18px;">Описание товара:</h3>

                    <!-- Блок текста с жестким ограничением в 5 строк силами CSS -->
                    <div id="desc-text" onclick="expandText()" style="color: #4a5568; font-size: 15px; line-height: 1.6; text-align: justify; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer;">
                        {{ brick.description|linebreaks }}
                    </div>

                    <!-- Кликабельная подсказка -->
                    <div id="read-more-btn" onclick="expandText()" style="color: #2980b9; font-size: 14px; font-weight: bold; margin-top: 8px; cursor: pointer;">Читать полностью...</div>
                </div>

                <!-- Синяя кнопка «Рассчитать товар», которая ведет на калькулятор -->
                <a href="{% url 'brick_detail' brick.id %}" style="background-color: #2980b9 !important; margin-top: 25px !important; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 6px; font-weight: bold; transition: background 0.2s;">
                    🧮 Рассчитать товар / Быстрый заказ
                </a>
            </div>

        </div>
    </div>

    <!-- Простой скрипт, который убирает ограничение в 5 строк при клике -->
    <script>
        function expandText() {
            var textZone = document.getElementById("desc-text");
            var hintZone = document.getElementById("read-more-btn");

            textZone.style.display = "block";
            textZone.style.overflow = "visible";
            textZone.style.cursor = "default";
            hintZone.style.display = "none"; // Прячем надпись "Читать полностью"
        }
    </script>

</body>
</html>
